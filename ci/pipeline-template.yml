          params:
            include_files:
              - bosh-stemcell-*-google-kvm-(@= data.values.stemcell_details.os_name @)*.tgz
          resource: candidate-(@= data.values.stemcell_details.os_name @)-stemcell-(@= str(data.values.stemcell_details.major_version) @)
