#@ load("@ytt:data", "data")

#@yaml/text-templated-strings
---

#@ def metalink_resource(IAAS, HYPERVISOR, FIPS=""):
  name: (@= IAAS @)-(@= HYPERVISOR @)(@= FIPS @)
  type: metalink-repository
  source:
    mirror_files:
      - destination: s3://storage.googleapis.com/bosh-core-stemcells-candidate(@= FIPS @)/(@= IAAS @)/{{.Name}}
    options:
      private_key: ((github_deploy_key_bosh-io-stemcells-core-index.private_key))
    filters:
      - repositorypath: "*/(@= IAAS @)-(@= HYPERVISOR @)(@= FIPS @)(@= data.values.stemcell_details.agent_suffix @).meta4"
    uri: git+ssh://git@github.com:cloudfoundry/bosh-io-stemcells-core-index.git//dev/(@= data.values.stemcell_details.os_name @)(@= FIPS @)/
    url_handlers:
      - include:
          - (s3|https)://.*
        options:
          access_key: ((hmac_accesskey))
          secret_key: ((hmac_secret))
        type: s3
#@ end

#@yaml/text-templated-strings
---

#@ def build_stemcell(IAAS, HYPERVISOR, FIPS=""):
name: build-(@= IAAS @)-(@= HYPERVISOR @)(@= FIPS @)
serial: true
plan:
  - in_parallel:
      - get: version
        passed:
          - build-stemcell
        resource: version
        trigger: true
      - get: bosh-stemcells-ci
      - get: os-image-stemcell-builder-registry-image
      - get: build-time
        passed:
          - build-stemcell
        trigger: true
      - get: bosh-linux-stemcell-builder
        passed:
          - build-stemcell
        resource: bosh-linux-stemcell-builder
      - get: stemcells-index
      - get: os-image-tarball
        passed:
          - build-os-image
  - task: create-stemcell
    file: bosh-stemcells-ci/ci/tasks/build.yml
    image: os-image-stemcell-builder-registry-image
    params:
      HYPERVISOR: #@ HYPERVISOR
      IAAS: #@ IAAS
      OS_NAME: ubuntu
      S3_API_ENDPOINT: storage.googleapis.com
      OS_VERSION: (@= data.values.stemcell_details.os_short_name @)(@= FIPS @)
      STEMCELL_BUCKET: bosh-core-stemcells-candidate(@= FIPS @)
      GIT_USER_EMAIL: (@= data.values.stemcell_details.bot_email @)
      GIT_USER_NAME: (@= data.values.stemcell_details.bot_name @)
      AGENT_SUFFIX: (@= data.values.stemcell_details.agent_suffix @)
      #@ if/end FIPS != "":
      UBUNTU_ADVANTAGE_TOKEN: ((ubuntu_advantage_token))
    privileged: true
    vars:
      image_os_tag: (@= data.values.stemcell_details.os_short_name @)
  - in_parallel:
      - put: (@= IAAS @)-(@= HYPERVISOR @)(@= FIPS @)
        attempts: 3
        params:
          files:
            - stemcell/*.tgz
          rename: "{{.Version}}/(@= IAAS @)-(@= HYPERVISOR @)(@= FIPS @)(@= data.values.stemcell_details.agent_suffix @).meta4"
          options:
            author_email: (@= data.values.stemcell_details.bot_email @)
            author_name: (@= data.values.stemcell_details.bot_name @)
            message: 'dev: (@= data.values.stemcell_details.os_name @)'
          version: candidate-build-number/number
#@ end

#@yaml/text-templated-strings
---

#@ def build_light_aws_stemcell_new(stemcell_os, stemcell_version, prefix, efi, ami_destinations, ami_excluded_destinations):
do:
  - in_parallel:
      - get: (@= prefix @)-input-stemcell
        params:
          include_files:
            - bosh-stemcell-*-aws-xen-hvm-(@= stemcell_os @)*.tgz
        resource: candidate-(@= stemcell_os @)-stemcell-(@= stemcell_version @)
        trigger: true
        version: every
  - task: build-(@= prefix @)-stemcell
    file: bosh-stemcells-ci/ci/tasks/light-aws/build.yml
    image: aws-light-stemcell-builder-registry-image
    input_mapping:
      input-stemcell: (@= prefix @)-input-stemcell
    output_mapping:
      light-stemcell: (@= prefix @)-light-stemcell
    params:
      AWS_PAGER:
      ami_access_key: ((aws_publish_(@= prefix @)_access_key))
      ami_secret_key: ((aws_publish_(@= prefix @)_secret_key))
      ami_region: ((aws_publish_(@= prefix @)_region))
      ami_bucket_name: ((aws_publish_(@= prefix @)_bucket))
      ami_description: Light Stemcell Builder Prod AMI
      #@ if ami_destinations != "":
      ami_destinations: (@= ami_destinations @)
      #@ end
      #@ if ami_excluded_destinations != "":
      ami_excluded_destinations: (@= ami_excluded_destinations @)
      #@ end
      ami_encrypted: false
      ami_kms_key_id: ""
      ami_server_side_encryption: ""
      ami_virtualization_type: hvm
      ami_visibility: public
      S3_API_ENDPOINT: storage.googleapis.com
      efi: (@= str(efi).lower() @)
#@ end

#@yaml/text-templated-strings
---
#@ def cleanup_unpublished_light_stemcells(prefix):
task: cleanup-amis-in-(@= prefix @)
file: bosh-stemcells-ci/ci/tasks/light-aws/cleanup-ami.yml
image: bosh-integration-registry-image
params:
  AWS_PAGER:
  ami_access_key: ((aws_publish_(@= prefix @)_access_key))
  ami_secret_key: ((aws_publish_(@= prefix @)_secret_key))
  ami_region: ((aws_publish_(@= prefix @)_region))
  ami_older_than_days: 60
  ami_keep_latest: 5
  os_name: (@= data.values.stemcell_details.os_name @)
#@ end

#@yaml/text-templated-strings
---
#@ def cleanup_old_published_light_stemcells(prefix):
task: cleanup-amis-in-(@= prefix @)
file: bosh-stemcells-ci/ci/tasks/light-aws/cleanup-ami.yml
image: bosh-integration-registry-image
params:
  AWS_PAGER:
  ami_access_key: ((aws_publish_(@= prefix @)_access_key))
  ami_secret_key: ((aws_publish_(@= prefix @)_secret_key))
  ami_region: ((aws_publish_(@= prefix @)_region))
  ami_older_than_days: 1095
  remove_public_images: true
#@ end

#@yaml/text-templated-strings
---
groups:
- name: build
  jobs:
  - bats
  - build-*
  - test-unit
  - test-stemcells-*
  - aggregate-candidate-stemcells
- name: publish
  jobs:
    - create-light-*
    - publish-*

- name: auto-bumps
  jobs:
  - bump-deps
  - bump-golang-deps
  - bump-bosh-agent
  - bump-bosh-blobstore-*

- name: automatic-triggers
  jobs:
  - process-high-critical-cves
  - check-usn-packages-are-available
  - log-low-medium-cves
  - notify-of-usn

- name: infrastructure-tending
  jobs:
  - build-os-image-stemcell-builder
  - ensure-integration-network
  - cleanup-published-*
  - cleanup-unpublished-*

#@yaml/text-templated-strings
jobs:
- name: build-os-image-stemcell-builder
  public: true
  serial: true
  plan:
    - get: daily
      trigger: true
    - get: ubuntu_base
    - get: os-image-stemcell-builder-dockerfile
      trigger: true
    - get: bosh-os-image-builder-vmware-ovftool
    - get: bosh-stemcells-ci
    - task: copy-ovf
      image: ubuntu_base
      config:
        platform: linux
        inputs:
          - name: bosh-os-image-builder-vmware-ovftool
          - name: os-image-stemcell-builder-dockerfile
        run:
          path: /bin/bash
          args:
          - -cex
          - |
            cp bosh-os-image-builder-vmware-ovftool/*.bundle \
              os-image-stemcell-builder-dockerfile/ci/docker/os-image-stemcell-builder/
        outputs:
        - name: os-image-stemcell-builder-dockerfile
    - task: build-docker-args
      file: bosh-stemcells-ci/ci/tasks/build-docker-args.yml
      image: ubuntu_base
    - task: build-image
      privileged: true
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: concourse/oci-build-task
        inputs:
        - name: os-image-stemcell-builder-dockerfile
        - name: docker-build-args
        outputs:
        - name: image
        params:
          CONTEXT: os-image-stemcell-builder-dockerfile/ci/docker/os-image-stemcell-builder
          BUILD_ARGS_FILE: docker-build-args/docker-build-args.yml
          BUILD_ARG_BASE_IMAGE: ubuntu:(@= data.values.stemcell_details.os_short_name @)
          BUILD_ARG_OVF_TOOL_INSTALLER: "VMware-ovftool-4.4.3-18663434-lin.x86_64.bundle"
          BUILD_ARG_OVF_TOOL_INSTALLER_SHA1: "6c24e473be49c961cfc3bb16774b52b48e822991"
        run:
          path: build
    - put: os-image-stemcell-builder-registry-image
      no_get: true
      params:
        image: image/image.tar

#! Manually triggered job that idempotently ensures the GCP subnetwork and
#! firewall rule consumed by deploy-director / cleanup-bats-vms / prepare-bats
#! in the test-stemcells-ipv4 and bats jobs below exist. GCP is the source of
#! truth — no state file is required.
- name: ensure-integration-network
  serial: true
  plan:
  - get: bosh-stemcells-ci
  - get: bosh-integration-registry-image
  - task: ensure-integration-network
    file: bosh-stemcells-ci/ci/tasks/gcp/ensure-integration-network.yml
    image: bosh-integration-registry-image
    params:
      GCP_JSON_KEY: ((gcp_json_key))
      GCP_PROJECT_ID: ((gcp_project_id))
      GCP_REGION: europe-north2
      GCP_NETWORK_NAME: bosh-concourse
      SUBNET_INT: (@= data.values.stemcell_details.subnet_int @)
      DIRECTOR_TAG: &bats-director-tag test-stemcells-(@= data.values.stemcell_details.os_short_name @)

- name: process-high-critical-cves
  serial_groups: [log-cves]
  plan:
    - in_parallel:
      - get: bosh-stemcells-ci
      - get: bosh-shared-ci
      - get: os-image-stemcell-builder-registry-image
      - get: bosh-linux-stemcell-builder
      - get: (@= data.values.stemcell_details.os_short_name @)-usn
        version: every
        trigger: true
      - get: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
      - get: usn-log
      - get: high-critical-unfound-usns
    - task: check-if-usn-is-in-github
      file: bosh-stemcells-ci/ci/tasks/check-if-usn-is-in-github.yml
      image: os-image-stemcell-builder-registry-image
      input_mapping:
        usn: (@= data.values.stemcell_details.os_short_name @)-usn
        usn-gh-json: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
        unfound-usns: high-critical-unfound-usns
      vars:
        image_os_tag: (@= data.values.stemcell_details.os_short_name @)
    - put: high-critical-unfound-usns
      params:
        file: updated-unfound-usns/usns.json
        predefined_acl: publicRead
    - try:
        task: check-if-usns-are-applicable
        file: bosh-stemcells-ci/ci/tasks/check-if-usns-are-applicable.yml
        image: os-image-stemcell-builder-registry-image
        input_mapping:
          usns: found-usns
          usn-gh-json: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
        params:
          OS: (@= data.values.stemcell_details.os_short_name @)
        vars:
          image_os_tag: (@= data.values.stemcell_details.os_short_name @)
        on_success:
          in_parallel:
            steps:
            - put: usn-log
              params:
                file: updated-usn-log/usn-log.json
                predefined_acl: publicRead
            - put: high-critical-cves-processed
    - task: verify-check-usn-was-successful
      image: os-image-stemcell-builder-registry-image
      file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
      input_mapping:
        task-output-folder: updated-usn-log

- name: check-usn-packages-are-available
  plan:
    - in_parallel:
      - get: bosh-stemcells-ci
      - get: os-image-stemcell-builder-registry-image
      - get: bosh-integration-registry-image
      - get: bosh-linux-stemcell-builder
      - get: usn-log
        passed:
          - process-high-critical-cves
        trigger: true
      #! - get: high-critical-cves-processed
      #!   trigger: true
      #!   passed:
      #!     - process-high-critical-cves
      - get: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
        passed:
          - process-high-critical-cves
    - task: check-usn-packages
      file: bosh-stemcells-ci/ci/tasks/check-usn-packages.yml
      image: os-image-stemcell-builder-registry-image
      input_mapping:
        usn-log-in: usn-log
        usn-gh-json: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
      params:
        OS: (@= data.values.stemcell_details.os_short_name @)
      vars:
        image_os_tag: (@= data.values.stemcell_details.os_short_name @)
    - task: write-message
      file: bosh-stemcells-ci/ci/tasks/write-bump-message.yml
      image: bosh-integration-registry-image
      params:
        MESSAGE_PREFIX: CVE Trigger
    - put: stemcell-trigger
      params:
        file: message/message.txt
        predefined_acl: publicRead

- name: log-low-medium-cves
  serial_groups: [log-cves]
  plan:
    - in_parallel:
      - get: bosh-stemcells-ci
      - get: bosh-shared-ci
      - get: os-image-stemcell-builder-registry-image
      - get: bosh-linux-stemcell-builder
      - get: (@= data.values.stemcell_details.os_short_name @)-usn-low-medium
        version: every
        trigger: true
      - get: usn-log
      - get: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
      - get: low-medium-unfound-usns
    - task: check-if-usn-is-in-github
      file: bosh-stemcells-ci/ci/tasks/check-if-usn-is-in-github.yml
      image: os-image-stemcell-builder-registry-image
      input_mapping:
        usn: (@= data.values.stemcell_details.os_short_name @)-usn-low-medium
        usn-gh-json: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
        unfound-usns: low-medium-unfound-usns
      vars:
        image_os_tag: (@= data.values.stemcell_details.os_short_name @)
    - put: low-medium-unfound-usns
      params:
        file: updated-unfound-usns/usns.json
        predefined_acl: publicRead
    - try:
        task: check-if-usns-are-applicable
        file: bosh-stemcells-ci/ci/tasks/check-if-usns-are-applicable.yml
        image: os-image-stemcell-builder-registry-image
        input_mapping:
          usns: found-usns
          usn-gh-json: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
        params:
          OS: (@= data.values.stemcell_details.os_short_name @)
        vars:
          image_os_tag: (@= data.values.stemcell_details.os_short_name @)
        on_success:
          put: usn-log
          params:
            file: updated-usn-log/usn-log.json
            predefined_acl: publicRead
    - task: verify-check-usn-was-successful
      image: os-image-stemcell-builder-registry-image
      file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
      input_mapping:
        task-output-folder: updated-usn-log

- name: build-os-image
  plan:
  - put: build-time
  - get: bosh-stemcells-ci
  - get: os-image-stemcell-builder-registry-image
  - get: bosh-linux-stemcell-builder
    trigger: true
  - get: version
    params:
      bump: "major"
    resource: os-image-version
  - get: usn-log
  - get: stemcell-trigger
    trigger: true
  - task: build
    file: bosh-stemcells-ci/ci/tasks/os-images/build.yml
    image: os-image-stemcell-builder-registry-image
    params:
      OPERATING_SYSTEM_NAME: ubuntu
      OPERATING_SYSTEM_VERSION: (@= data.values.stemcell_details.os_short_name @)
      UBUNTU_DEBOOTSTRAP_MIRROR: http://mirrors.edge.kernel.org/ubuntu
    privileged: true
    vars:
      image_os_tag: (@= data.values.stemcell_details.os_short_name @)
  - put: os-image-tarball
    params:
      files:
      - os-image/(@= data.values.stemcell_details.os_name @).tgz
      - usn-log/usn-log.json
      rename: (@= data.values.stemcell_details.branch @)/(@= data.values.stemcell_details.os_name @).meta4
      options:
        author_email: (@= data.values.stemcell_details.bot_email @)
        author_name: (@= data.values.stemcell_details.bot_name @)
        message: 'Bump os-image tgz'
      version: version/version
  - put: os-image-version
    params:
      file: version/number

- name: test-unit
  plan:
  - get: bosh-stemcells-ci
  - get: bosh-integration-registry-image
  - get: bosh-linux-stemcell-builder
    trigger: true
    passed:
    - build-os-image
  - get: build-time
    passed:
      - build-os-image
    trigger: true
  - get: os-image-tarball
    passed:
    - build-os-image
  - task: test-unit
    file: bosh-stemcells-ci/ci/tasks/test-unit.yml
    image: bosh-integration-registry-image
    privileged: true
  serial: true

- name: build-stemcell
  plan:
  - get: bosh-stemcells-ci
  - get: bosh-linux-stemcell-builder
    passed:
    - test-unit
    - build-os-image
    resource: bosh-linux-stemcell-builder
    trigger: true
  - get: build-time
    passed:
      - test-unit
    trigger: true
  - get: version
    params:
      bump: minor
    resource: version
  - put: version
    params:
      file: version/number
  serial: true

- name: test-stemcells-ipv4
  plan:
  - do:
    - in_parallel:
      - get: version
        passed:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        resource: version
        trigger: true
      - get: bosh-stemcells-ci
      - get: bosh-integration-registry-image
      - get: bosh-linux-stemcell-builder
      - get: bosh-deployment
      - get: syslog-release
      - get: bpm-release
      - get: os-conf-release
      - get: stemcell
        passed:
        - build-google-kvm
        resource: google-kvm
      - get: build-time
        passed:
          - build-os-image
      #@ for iaas in data.values.stemcell_details.include_iaas:
          - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
          - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        trigger: true
    - do:
      - task: deploy-director
        file: bosh-stemcells-ci/ci/tasks/gcp/deploy-director.yml
        image: bosh-integration-registry-image
        params:
          GCP_PROJECT_ID: ((gcp_project_id))
          GCP_ZONE: europe-north2-a
          GCP_PREEMPTIBLE: false
          GCP_NETWORK_NAME: bosh-concourse
          GCP_SUBNET_NAME: stemcell-builder-integration-(@= data.values.stemcell_details.subnet_int @)
          GCP_JSON_KEY: ((gcp_json_key))
          INTERNAL_IP: 10.100.(@= data.values.stemcell_details.subnet_int @).10
          INTERNAL_CIDR: 10.100.(@= data.values.stemcell_details.subnet_int @).0/24
          INTERNAL_GW: 10.100.(@= data.values.stemcell_details.subnet_int @).1
          RESERVED_RANGE: '10.100.(@= data.values.stemcell_details.subnet_int @).2 - 10.100.(@= data.values.stemcell_details.subnet_int @).9, 10.100.(@= data.values.stemcell_details.subnet_int @).62 - 10.100.(@= data.values.stemcell_details.subnet_int @).254'
          TAG: test-stemcells-ipv4
          DEFAULT_VM_TYPE: e2-standard-2
      - task: test-stemcell
        attempts: 3
        file: bosh-stemcells-ci/ci/tasks/test-stemcell.yml
        image: bosh-integration-registry-image
        params:
          BOSH_os_name: (@= data.values.stemcell_details.os_name @)
          package: ipv4director
    ensure:
      do:
      - task: teardown
        file: bosh-stemcells-ci/ci/tasks/teardown.yml
        image: bosh-integration-registry-image
        attempts: 3
        timeout: 15m
  serial: true

#@ if data.values.stemcell_details.test_ipv6:
- name: test-stemcells-ipv6
  plan:
  - do:
    - in_parallel:
      - get: version
        passed:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        resource: version
        trigger: true
      - get: bosh-stemcells-ci
      - get: bosh-integration-registry-image
      - get: bosh-linux-stemcell-builder
      - get: bosh-deployment
      - get: syslog-release
      - get: bpm-release
      - get: os-conf-release
      - get: stemcell
        passed:
        - build-google-kvm
        resource: google-kvm
      - get: build-time
        passed:
          - build-os-image
          #@ for iaas in data.values.stemcell_details.include_iaas:
          - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
          #@ end
          #@ for iaas in data.values.stemcell_details.include_fips_iaas:
          - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
          #@ end
        trigger: true
    - do:
      - task: deploy-director-ipv6
        file: bosh-stemcells-ci/ci/tasks/gcp/deploy-director-ipv6.yml
        image: bosh-integration-registry-image
        params:
          GCP_PROJECT_ID: ((gcp_project_id))
          GCP_ZONE: europe-north2-a
          GCP_NETWORK_NAME: ipv6-test
          GCP_SUBNET_NAME: stemcell-builder-integration-ipv6-(@= data.values.stemcell_details.subnet_int @)
          GCP_JSON_KEY: ((gcp_json_key))
          INTERNAL_IP: 10.100.(@= data.values.stemcell_details.subnet_int @).10
          INTERNAL_CIDR: 10.100.(@= data.values.stemcell_details.subnet_int @).0/24
          INTERNAL_GW: 10.100.(@= data.values.stemcell_details.subnet_int @).1
          RESERVED_RANGE: '10.100.(@= data.values.stemcell_details.subnet_int @).2 - 10.100.(@= data.values.stemcell_details.subnet_int @).9, 10.100.(@= data.values.stemcell_details.subnet_int @).62 - 10.100.(@= data.values.stemcell_details.subnet_int @).254'
          SECOND_INTERNAL_CIDR: fd20:ecb:bcac:4000:0:0:0:0/64
          SECOND_INTERNAL_GW: fd20:ecb:bcac:4000::1
          SECOND_INTERNAL_IP: fd20:ecb:bcac:4000::10
          TAG: test-stemcells-ipv6
      - task: test-stemcell-ipv6
        attempts: 3
        file: bosh-stemcells-ci/ci/tasks/test-stemcell.yml
        image: bosh-integration-registry-image
        params:
          BOSH_os_name: (@= data.values.stemcell_details.os_name @)
          package: ipv6director
    ensure:
