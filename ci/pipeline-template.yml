- name: notify-of-usn
  plan:
  - get: (@= data.values.stemcell_details.os_short_name @)-usn
    passed:
      - process-high-critical-cves
  - get: bosh-integration-registry-image
  - get: high-critical-cves-processed
    passed:
      - process-high-critical-cves
    trigger: true
  - task: build-slack-message
    image: bosh-integration-registry-image
    config:
      inputs:
      - name: (@= data.values.stemcell_details.os_short_name @)-usn
      outputs:
      - name: slack-message
      platform: linux
      run:
        args:
        - -c
        - |
          set -exu -o pipefail
          cat <<EOF > template.json
          {
            "attachments": {
              "color": "#ff0000",
                "thumb_url": "https://www.free-icons-download.net/images/lock-icon-66412.png",
                "footer": "USN Notification",
                "footer_icon": "https://i.imgur.com/7H8ZIq1.png",
                "mrkdwn_in": ["fields"],
                "fields": [
                {"title": "Priorities", "short": true, "value": (.priorities | join(", "))},
                {"title": "Date", "short": true, "value": .date},
                {"title": "Description", "short": false, "value": .description},
                {"title": "CVEs", "short": false, "value": (.cves | join("\n"))}
                ]
            }
          }
          EOF
          cat (@= data.values.stemcell_details.os_short_name @)-usn/usn.json | jq -r "$(cat template.json)" | tee slack-message/attachments
          cat (@= data.values.stemcell_details.os_short_name @)-usn/usn.json | jq -r '"New USN for (@= data.values.stemcell_details.os_short_name @): *<\(.url)|\(.title)>*"' | tee slack-message/message
        path: /bin/bash
  - put: slack-alert
    params:
      attachments_file: slack-message/attachments
      channel: ((usn_notifications_slack_channel_name))
      icon_url: https://i.imgur.com/A0Vlw5t.png
      text_file: slack-message/message

