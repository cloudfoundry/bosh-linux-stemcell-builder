- name: bats
  serial: true
  plan:
  - do:
    - in_parallel:
      - get: stemcell
        passed:
        - build-google-kvm
        resource: google-kvm
        trigger: true
      - get: bats
      - get: bosh-deployment
      - get: bosh-stemcells-ci
      - get: bosh-integration-image
      - get: bosh-linux-stemcell-builder
        passed:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        resource: bosh-linux-stemcell-builder
      - get: version
        passed:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        resource: version
      - get: build-time
        passed:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)
      #@ end
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - build-(@= iaas.iaas @)-(@= iaas.hypervisor @)-fips
      #@ end
        trigger: true
    - do:
      - task: cleanup-bats-vms
        file: bosh-stemcells-ci/ci/tasks/gcp/cleanup-bats-vms.yml
        image: bosh-integration-image
        params:
          GCP_JSON_KEY: ((gcp_json_key))
          GCP_PROJECT_ID: ((gcp_project_id))
          GCP_ZONE: europe-north2-a
          GCP_SUBNET_NAME: stemcell-builder-integration-(@= data.values.stemcell_details.subnet_int @)
          TAG: *bats-director-tag
      - task: deploy-director
        file: bosh-stemcells-ci/ci/tasks/gcp/deploy-director.yml
        image: bosh-integration-image
        params:
          GCP_PROJECT_ID: ((gcp_project_id))
          GCP_ZONE: europe-north2-a
          GCP_PREEMPTIBLE: false
          GCP_NETWORK_NAME: bosh-concourse
          GCP_SUBNET_NAME: stemcell-builder-integration-(@= data.values.stemcell_details.subnet_int @)
          GCP_JSON_KEY: ((gcp_json_key))
          INTERNAL_IP: 10.100.(@= data.values.stemcell_details.subnet_int @).66
          INTERNAL_CIDR: 10.100.(@= data.values.stemcell_details.subnet_int @).0/24
          INTERNAL_GW: 10.100.(@= data.values.stemcell_details.subnet_int @).1
          RESERVED_RANGE: '10.100.(@= data.values.stemcell_details.subnet_int @).2 - 10.100.(@= data.values.stemcell_details.subnet_int @).63, 10.100.(@= data.values.stemcell_details.subnet_int @).126 - 10.100.(@= data.values.stemcell_details.subnet_int @).254'
          TAG: *bats-director-tag
      - task: prepare-bats
        file: bosh-stemcells-ci/ci/tasks/bats/iaas/gcp/prepare-bats-config.yml
        image: bosh-integration-image
        params:
          VARS_STEMCELL_NAME: bosh-google-kvm-ubuntu-(@= data.values.stemcell_details.os_short_name @)(@= data.values.stemcell_details.agent_suffix @)
          VARS_NETWORK_DEFAULT: bosh-concourse
          VARS_AVAILABILITY_ZONE: europe-north2-a
          VARS_MACHINE_TYPE: e2-standard-2
          VARS_ZONE: europe-north2-a
          VARS_PREEMPTIBLE: false
          VARS_SUBNETWORK_DEFAULT: stemcell-builder-integration-(@= data.values.stemcell_details.subnet_int @)
          VARS_CIDR_DEFAULT: "10.100.(@= data.values.stemcell_details.subnet_int @).0/24"
          VARS_RESERVED_DEFAULT: '10.100.(@= data.values.stemcell_details.subnet_int @).2 - 10.100.(@= data.values.stemcell_details.subnet_int @).129, 10.100.(@= data.values.stemcell_details.subnet_int @).190 - 10.100.(@= data.values.stemcell_details.subnet_int @).254'
          VARS_STATIC_DEFAULT: '10.100.(@= data.values.stemcell_details.subnet_int @).130 - 10.100.(@= data.values.stemcell_details.subnet_int @).155'
          VARS_STATIC_IP_DEFAULT: 10.100.(@= data.values.stemcell_details.subnet_int @).130
          VARS_STATIC_IP_DEFAULT-2: 10.100.(@= data.values.stemcell_details.subnet_int @).132
          VARS_GATEWAY_DEFAULT: 10.100.(@= data.values.stemcell_details.subnet_int @).1
      - task: run-bats
        file: bats/ci/tasks/run-bats.yml
        image: bosh-integration-image
    ensure:
      do:
      - task: teardown
        file: bosh-stemcells-ci/ci/tasks/teardown.yml
        image: bosh-integration-image
        attempts: 3
        timeout: 15m

- name: aggregate-candidate-stemcells
  serial: true
  plan:
  - in_parallel:
    - get: version
      passed:
      - test-stemcells-ipv4
      - bats
      resource: version
      trigger: true
    - get: bosh-stemcells-ci
    - get: bosh-integration-image
    - get: bosh-linux-stemcell-builder
      passed:
      - bats
      resource: bosh-linux-stemcell-builder
    - get: stemcells-index
    - get: build-time
      passed:
      - test-stemcells-ipv4
      - bats
      trigger: true
    - get: os-image-stemcell-builder-registry-image
  - task: commit-build-time
    file: bosh-stemcells-ci/ci/tasks/commit-build-time.yml
    image: os-image-stemcell-builder-registry-image
    params:
      GIT_USER_EMAIL: *ci_bot_email
      GIT_USER_NAME: *ci_bot_name
    #@ if len(data.values.stemcell_details.include_fips_iaas) > 0:
  - task: copy-fips-artifacts
    file: bosh-stemcells-ci/ci/tasks/publish.yml
    image: bosh-integration-image
    params:
      AWS_ACCESS_KEY_ID: ((hmac_accesskey))
      AWS_SECRET_ACCESS_KEY: ((hmac_secret))
      COMMIT_PREFIX: candidate
      COPY_KEYS:
      #@ for iaas in data.values.stemcell_details.include_fips_iaas:
        - (@= iaas.iaas @)/bosh-stemcell-%s-(@= iaas.iaas @)-(@= iaas.hypervisor @)-(@= data.values.stemcell_details.os_name @)-fips(@= data.values.stemcell_details.agent_suffix @).tgz
      #@ end
      FROM_BUCKET_NAME: bosh-core-stemcells-candidate-fips
      FROM_INDEX: dev
      OS_NAME: ubuntu
      OS_VERSION: (@= data.values.stemcell_details.os_short_name @)-fips
      TO_BUCKET_NAME: bosh-core-stemcells-candidate-fips
      TO_INDEX: candidate
      AWS_ENDPOINT: "https://storage.googleapis.com"
      S3_API_ENDPOINT: storage.googleapis.com
      GIT_USER_EMAIL: *ci_bot_email
      GIT_USER_NAME: *ci_bot_name
    #@ end
  - task: copy-artifacts
    file: bosh-stemcells-ci/ci/tasks/publish.yml
    image: bosh-integration-image
    params:
      AWS_ACCESS_KEY_ID: ((hmac_accesskey))
      AWS_SECRET_ACCESS_KEY: ((hmac_secret))
      COMMIT_PREFIX: candidate
      COPY_KEYS:
      #@ for iaas in data.values.stemcell_details.include_iaas:
        - (@= iaas.iaas @)/bosh-stemcell-%s-(@= iaas.iaas @)-(@= iaas.hypervisor @)-(@= data.values.stemcell_details.os_name @)(@= data.values.stemcell_details.agent_suffix @).tgz
      #@ end
      FROM_BUCKET_NAME: bosh-core-stemcells-candidate
      FROM_INDEX: dev
      OS_NAME: ubuntu
      OS_VERSION: (@= data.values.stemcell_details.os_short_name @)
      TO_BUCKET_NAME: bosh-core-stemcells-candidate
      TO_INDEX: candidate
      AWS_ENDPOINT: "https://storage.googleapis.com"
      S3_API_ENDPOINT: storage.googleapis.com
      GIT_USER_EMAIL: *ci_bot_email
      GIT_USER_NAME: *ci_bot_name
  - in_parallel:
    - put: bosh-linux-stemcell-builder-push-tags
      no_get: true
      params:
        only_tag: true
        repository: bosh-linux-stemcell-builder
        tag: version-tag/tag
    - put: stemcells-index
      params:
        rebase: true
        repository: stemcells-index

- name: notify-of-usn
  plan:
  - get: (@= data.values.stemcell_details.os_short_name @)-usn
    passed:
      - process-high-critical-cves
  - get: bosh-integration-image
  - get: high-critical-cves-processed
    passed:
      - process-high-critical-cves
    trigger: true
  - task: build-slack-message
    image: bosh-integration-image
    config:
      inputs:
      - name: (@= data.values.stemcell_details.os_short_name @)-usn
      outputs:
      - name: slack-message
      platform: linux
      run:
        args:
        - -c
        - |
          set -exu -o pipefail
          cat <<EOF > template.json
          {
            "attachments": {
              "color": "#ff0000",
                "thumb_url": "https://www.free-icons-download.net/images/lock-icon-66412.png",
                "footer": "USN Notification",
                "footer_icon": "https://i.imgur.com/7H8ZIq1.png",
                "mrkdwn_in": ["fields"],
                "fields": [
                {"title": "Priorities", "short": true, "value": (.priorities | join(", "))},
                {"title": "Date", "short": true, "value": .date},
                {"title": "Description", "short": false, "value": .description},
                {"title": "CVEs", "short": false, "value": (.cves | join("\n"))}
                ]
            }
          }
          EOF
          cat (@= data.values.stemcell_details.os_short_name @)-usn/usn.json | jq -r "$(cat template.json)" | tee slack-message/attachments
          cat (@= data.values.stemcell_details.os_short_name @)-usn/usn.json | jq -r '"New USN for (@= data.values.stemcell_details.os_short_name @): *<\(.url)|\(.title)>*"' | tee slack-message/message
        path: /bin/bash
  - put: slack-alert
    params:
      attachments_file: slack-message/attachments
      channel: ((usn_notifications_slack_channel_name))
      icon_url: https://i.imgur.com/A0Vlw5t.png
      text_file: slack-message/message

- name: bump-deps
  plan:
    - in_parallel:
        - get: bosh-linux-stemcell-builder
        - get: bosh-stemcells-ci
        - get: ruby-release
        - get: bosh-ruby-release-registry-image
        - get: weekly
          trigger: true
        - get: bosh-integration-image
        - get: os-image-tarball
          passed:
            - build-os-image
    - load_var: ruby_version
      file: bosh-linux-stemcell-builder/.ruby-version
      reveal: true
    - task: bump-gems
      image: bosh-ruby-release-registry-image
      file: ruby-release/ci/tasks/shared/bump-gems.yml
      input_mapping:
        input-repo: bosh-linux-stemcell-builder
      output_mapping:
        output-repo: bosh-linux-stemcell-builder
      params:
        GIT_USER_EMAIL: *ci_bot_email
        GIT_USER_NAME: *ci_bot_name
        PACKAGE: ruby-((.:ruby_version))
        VENDOR: true
    - task: test-unit
      file: bosh-stemcells-ci/ci/tasks/test-unit.yml
      image: bosh-integration-image
      privileged: true
    - put: bosh-linux-stemcell-builder-push
      params:
        repository: bosh-linux-stemcell-builder
        rebase: true

- name: bump-golang-deps
  plan:
    - get: weekly
      trigger: true
    - get: bosh-stemcells-ci
    - get: bosh-linux-stemcell-builder
    - get: bosh-integration-image
    - get: golang-release
    - task: bump-deps
      file: golang-release/ci/tasks/shared/bump-deps.yml
      input_mapping:
        input_repo: bosh-linux-stemcell-builder
      output_mapping:
        output_repo: bosh-linux-stemcell-builder
      params:
        GIT_USER_EMAIL: *ci_bot_email
        GIT_USER_NAME: *ci_bot_name
        SOURCE_PATH: acceptance-tests/
    - task: acceptance-tests-dry-run
      image: bosh-integration-image
      config:
        platform: linux
        inputs:
          - name: bosh-linux-stemcell-builder
        run:
          path: /bin/bash
          args:
            - -c
            - |
              set -eu -o pipefail
              cd bosh-linux-stemcell-builder/acceptance-tests/
              go run github.com/onsi/ginkgo/v2/ginkgo run -r --dry-run .
        outputs:
          - name: os-image-stemcell-builder-dockerfile
    - put: bosh-linux-stemcell-builder-push
      params:
        repository: bosh-linux-stemcell-builder
        rebase: true

- name: bump-bosh-agent
  plan:
  - get: bosh-agent
    params:
      skip_download: true
    resource: bosh-agent
    trigger: true
  - get: bosh-stemcells-ci
  - get: bosh-integration-image
  - get: bosh-linux-stemcell-builder
  - task: bump
    file: bosh-stemcells-ci/ci/tasks/bump-bosh-agent.yml
    image: bosh-integration-image
    params:
      GIT_USER_EMAIL: *ci_bot_email
      GIT_USER_NAME: *ci_bot_name
  - put: bosh-linux-stemcell-builder-push
    params:
      rebase: true
      repository: bosh-linux-stemcell-builder
  serial: true
  #@ for blobstore_type in data.values.blobstore_types:
- name: bump-bosh-blobstore-(@= blobstore_type @)
  plan:
  - get: bosh-blobstore-cli
    resource:  bosh-blobstore-(@= blobstore_type @)
    trigger: true
  - get: bosh-stemcells-ci
  - get: bosh-integration-image
  - get: bosh-linux-stemcell-builder
  - task: bump-bosh-blobstore-cli
    file: bosh-stemcells-ci/ci/tasks/bump-bosh-blobstore-cli.yml
    image: bosh-integration-image
    params:
      BLOBSTORE_TYPE: (@= blobstore_type @)
      GIT_USER_EMAIL: *ci_bot_email
      GIT_USER_NAME: *ci_bot_name
  - put: bosh-linux-stemcell-builder-push
    params:
      rebase: true
      repository: bosh-linux-stemcell-builder
  serial: true
  #@ end

resource_types:
- name: ami-resource
  type: registry-image
  source:
    repository: pivotalgreenhouse/ami-resource
    tag: latest
- name: github-status
  type: registry-image
  source:
    repository: dpb587/github-status-resource
    tag: master
- name: usn
  source:
    repository: bosh/usn-resource
  type: registry-image
- name: metalink-repository
  source:
    repository: dpb587/metalink-repository-resource
    tag: latest
  type: registry-image
- name: slack-notification
  source:
    repository: cfcommunity/slack-notification-resource
    tag: latest
  type: registry-image
- name: gcs-resource
  type: registry-image
  source:
    repository: frodenas/gcs-resource
#@yaml/text-templated-strings
resources:
- name: daily
  type: time
  source:
    initial_version: true
    interval: 24h
- name: weekly
  type: time
  source:
    initial_version: true
    start: 3:00 -0700
    stop: 4:30 -0700
    days:
      - Saturday

- name: bosh-agent
  type: metalink-repository
  source:
    uri: git+https://github.com/cloudfoundry/bosh-agent-index.git/
    version: "*"

#@ for iaas in data.values.stemcell_details.include_iaas:
- #@ metalink_resource(iaas.iaas, iaas.hypervisor)
#@ end
#@ for iaas in data.values.stemcell_details.include_fips_iaas:
- #@ metalink_resource(iaas.iaas, iaas.hypervisor, "-fips")
#@ end

- name: os-image-tarball
  type: metalink-repository
  source:
    mirror_files:
    - destination: s3://storage.googleapis.com/bosh-os-images/(@= data.values.stemcell_details.branch @)/{{.Name}}
    options:
      private_key: ((github_deploy_key_bosh-linux-stemcell-builder.private_key))
    filters:
    - repositorypath: "(@= data.values.stemcell_details.branch @)/(@= data.values.stemcell_details.os_name @).meta4"
    uri: git+ssh://git@github.com/cloudfoundry/bosh-linux-stemcell-builder.git//image-metalinks/#(@= data.values.stemcell_details.branch @)
    url_handlers:
    - include:
      - (s3|https)://.*
      options:
        access_key: ((hmac_accesskey))
        secret_key: ((hmac_secret))
      type: s3

- name: version
  type: semver
  source:
    json_key: ((gcp_json_key))
    bucket: bosh-core-stemcells-candidate
    driver: gcs
    key: bosh-stemcell/(@= data.values.stemcell_details.branch @)/1.x/1.x-version

- name: os-image-version
  type: semver
  source:
    json_key: ((gcp_json_key))
    bucket: bosh-core-stemcells-candidate
    driver: gcs
    key: os-image/(@= data.values.stemcell_details.branch @)/1.x/1.x-version

- name: bosh-linux-stemcell-builder-push
  type: git
  source:
    branch: (@= data.values.stemcell_details.branch @)
    private_key: ((github_deploy_key_bosh-linux-stemcell-builder.private_key))
    uri: git@github.com:cloudfoundry/bosh-linux-stemcell-builder

- name: bosh-linux-stemcell-builder
  type: git
  source:
    branch: (@= data.values.stemcell_details.branch @)
    ignore_paths:
    - ci
    - image-metalinks
    - VERSION
    uri: https://github.com/cloudfoundry/bosh-linux-stemcell-builder

- name: bosh-shared-ci
  type: git
  source:
    uri: git@github.com:cloudfoundry/bosh-shared-ci.git
    private_key: ((github_deploy_key_bosh-shared-ci.private_key))

- name: usn-log
  type: gcs-resource
  source:
    bucket: bosh-stemcell-triggers
    json_key: ((gcp_json_key))
    versioned_file: (@= data.values.stemcell_details.branch @)/usn-log.json
    initial_content_text: ""
    initial_version: '0'

- name: high-critical-unfound-usns
  type: gcs-resource
  source:
    bucket: bosh-stemcell-triggers
    json_key: ((gcp_json_key))
    versioned_file: (@= data.values.stemcell_details.branch @)/high-critical-unfound/usns.json
    initial_content_text: ""
    initial_version: '0'

- name: low-medium-unfound-usns
  type: gcs-resource
  source:
    bucket: bosh-stemcell-triggers
    json_key: ((gcp_json_key))
    versioned_file: (@= data.values.stemcell_details.branch @)/low-medium-unfound/usns.json
    initial_content_text: ""
    initial_version: '0'

- name: stemcell-trigger
  type: gcs-resource
  source:
    json_key: ((gcp_json_key))
    bucket: bosh-stemcell-triggers
    versioned_file: (@= data.values.stemcell_details.branch @)/stemcell-trigger
    initial_content_text: ""
    initial_version: '0'

- name: bosh-linux-stemcell-builder-push-tags
  type: git
  source:
    fake_param_to_bust_global_resource_cache: true
    private_key: ((github_deploy_key_bosh-linux-stemcell-builder.private_key))
    uri: git@github.com:cloudfoundry/bosh-linux-stemcell-builder

- name: os-image-stemcell-builder-dockerfile
  type: git
  source:
    branch:  (@= data.values.stemcell_details.branch @)
    paths:
      - ci/docker/
    uri: https://github.com/cloudfoundry/bosh-linux-stemcell-builder

- name: build-time
  type: time

- name: high-critical-cves-processed
  type: time

- name: bosh-stemcells-ci
  type: git
  source:
    branch: (@= data.values.stemcell_details.branch @)
    uri: https://github.com/cloudfoundry/bosh-linux-stemcell-builder.git
    paths:
      - ci
      - .ruby-version
      - acceptance-tests
    uri: https://github.com/cloudfoundry/bosh-linux-stemcell-builder.git

- name: bats
  type: git
  source:
    branch: master
    uri: https://github.com/cloudfoundry/bosh-acceptance-tests.git

- name: bosh-integration-image
  type: registry-image
  source:
    repository: ghcr.io/cloudfoundry/bosh/integration
    tag: main
    username: ((github_read_write_packages.username))
    password: ((github_read_write_packages.password))

- name: stemcells-index
  type: git
  source:
    branch: main
    private_key: ((github_deploy_key_bosh-io-stemcells-core-index.private_key))
    uri: git@github.com:cloudfoundry/bosh-io-stemcells-core-index.git

- name: syslog-release
  type: bosh-io-release
  source:
    repository: cloudfoundry/syslog-release

- name: os-conf-release
  type: bosh-io-release
  source:
    repository: cloudfoundry/os-conf-release

- name: bpm-release
  type: bosh-io-release
  source:
    repository: cloudfoundry/bpm-release

- name: bosh-deployment
  type: git
  source:
    branch: master
    uri: https://github.com/cloudfoundry/bosh-deployment
- name: (@= data.values.stemcell_details.os_short_name @)-usn-low-medium
  type: usn
  source:
    os: ubuntu-(@= data.values.stemcell_details.os_version @)-lts
    priorities:
    - low
    - medium
- name: (@= data.values.stemcell_details.os_short_name @)-usn
  type: usn
  source:
    os: ubuntu-(@= data.values.stemcell_details.os_version @)-lts
    priorities:
    - high
    - critical
    severities:
    - high
    - critical
- name: (@= data.values.stemcell_details.os_short_name @)-usn-gh-json
  type: git
  source:
    branch: main
    uri: https://github.com/canonical/ubuntu-security-notices.git
    paths:
    - usn
- name: slack-alert
  type: slack-notification
  source:
    url: ((slack_hook_url))

- name: bosh-ruby-release-registry-image
  type: registry-image
  source:
    repository: bosh/ruby-release
    username: ((dockerhub_username))
    password: ((dockerhub_password))
- name: ruby-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-package-ruby-release.git

- name: golang-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-package-golang-release.git
    branch: main

- name: ubuntu_base
  type: registry-image
  source:
    repository: ubuntu
    tag: (@= data.values.stemcell_details.os_short_name @)
    username: ((dockerhub_username))
    password: ((dockerhub_password))

- name: os-image-stemcell-builder-registry-image
  type: registry-image
  source:
    repository: bosh/os-image-stemcell-builder
    tag: (@= data.values.stemcell_details.os_short_name @)
    username: ((dockerhub_username))
    password: ((dockerhub_password))

- name: bosh-os-image-builder-vmware-ovftool
  type: gcs-resource
  source:
    json_key: ((gcp_json_key))
    bucket: bosh-vmware-ovftool
    regexp: (@= data.values.stemcell_details.os_short_name @)/(.*).bundle

- name: bosh-blobstore-dav
  type: s3
  source:
    regexp: davcli-(.*)-linux-amd64
    bucket: bosh-davcli-artifacts
    access_key_id: ((bosh_davcli_pipeline_aws_access_key.username))
    secret_access_key: ((bosh_davcli_pipeline_aws_access_key.password))

- name: bosh-blobstore-gcs
  type: s3
  source:
    regexp: bosh-gcscli-(.*)-linux-amd64
    bucket: bosh-gcscli-artifacts
    access_key_id: ((bosh_gcscli_pipeline_aws_access_key.username))
    secret_access_key: ((bosh_gcscli_pipeline_aws_access_key.password))

- name: bosh-blobstore-s3
  type: s3
  source:
    regexp: s3cli-(.*)-linux-amd64
    bucket: bosh-s3cli-artifacts
    access_key_id: ((bosh_s3cli_pipeline_aws_access_key.username))
    secret_access_key: ((bosh_s3cli_pipeline_aws_access_key.password))

- name: bosh-blobstore-azure-storage
  type: s3
  source:
    regexp: azure-storage-cli-(.*)-linux-amd64
    bucket: bosh-azure-storage-cli-artifacts
    access_key_id: ((bosh_azure_storage_cli_pipeline_aws_access_key.username))
    secret_access_key: ((bosh_azure_storage_cli_pipeline_aws_access_key.password))
