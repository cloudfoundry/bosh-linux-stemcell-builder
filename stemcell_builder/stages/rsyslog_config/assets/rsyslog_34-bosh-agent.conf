# Must be numbered below the syslog-release forwarding rule
# (35-syslog-release-forwarding-rules.conf), which the syslog_forwarder job
# drops in at deploy time with a catch-all `*.* @@<drain>`. rsyslog.d files are
# processed in lexical order, so this rule must run first for `& stop` to keep
# bosh-agent's DEBUG output local instead of forwarding it to the log drain.
if $programname == 'bosh-agent' then
/var/log/bosh-agent.log
& stop
